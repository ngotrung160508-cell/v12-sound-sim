<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>V12 Sound &amp; Drive</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #07070f;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #e8ebf5;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    canvas { display: block; position: fixed; inset: 0; z-index: 1; }

    #overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at center, rgba(16, 10, 40, 0.82), rgba(4, 4, 10, 0.96));
      z-index: 30;
      transition: opacity 0.35s;
    }
    #overlay.hidden { opacity: 0; pointer-events: none; display: none; }

    .card {
      max-width: 500px;
      width: calc(100% - 28px);
      padding: 24px 22px;
      border-radius: 18px;
      background: rgba(14, 16, 32, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.14);
      text-align: center;
    }
    h1 {
      margin: 0;
      font-size: clamp(22px, 6vw, 32px);
      letter-spacing: 0.1em;
      background: linear-gradient(90deg, #ffe27a, #ff3d81);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .sub { margin: 6px 0 16px; color: #aab0c8; font-size: 13px; }
    .keys { display: grid; gap: 6px; text-align: left; font-size: 13px; color: #cfd3e6; }
    kbd {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 5px;
      background: #23263c;
      border: 1px solid #3a3f5c;
      font-size: 11px;
      font-family: inherit;
    }
    .tip { margin: 14px 0 4px; font-size: 12.5px; color: #ffd84a; }
